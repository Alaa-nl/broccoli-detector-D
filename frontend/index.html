<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/broccoli.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BroccoliDetect - Crown Detection PoC</title>
    <script>
      // Apply the saved theme before first paint so dark-mode users don't see
      // a light flash. React reads the same value on mount (see App.jsx).
      try {
        if (localStorage.getItem('darkMode') === 'true') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* storage blocked - fall back to light */ }
    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
