# Render Blueprint for the BroccoliDetect proof of concept.
#
# Deploy with: https://dashboard.render.com/blueprints
# (Render reads this file from the repo root.)
#
# Two services:
#   - backend   FastAPI + YOLOv8n
#   - frontend  React + Nginx (proxies /api/ and /uploads/ to backend)
#
# Why we route the frontend → backend over the *public* URL instead of
# Render's private network: nginx's `resolver` talks raw UDP/53, and
# Render's private DNS isn't reachable that way. Public DNS works
# reliably. The latency cost is negligible for this PoC.

services:
  - type: web
    name: broccoli-backend
    runtime: docker
    # Free tier is acceptable for occasional manual testing of the API.
    # For an interactive demo, run locally with `docker compose up` —
    # YOLO inference needs more CPU than free (0.1) or starter (0.5)
    # comfortably provide, and free-tier instances are killed by the
    # 5-second healthcheck timeout while inference blocks the event loop.
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Secret API key required on /api/detect. Render generates a random
      # value on first deploy; the frontend pulls the same value below and
      # injects it as the X-API-Key header (the browser never sees it).
      - key: API_KEY
        generateValue: true
      # Known-good SHA-256 of backend/weights/best.pt. The detector hashes
      # the file and refuses to load (torch.load/unpickle) if it does not
      # match, rejecting a tampered/swapped checkpoint at startup.
      # Update this value whenever the model is retrained.
      - key: EXPECTED_WEIGHTS_SHA256
        value: bf5f8500bba6a3b52bb55aec0212eef64581bff199e0e64a9f42322bf04acf6f
      # Hide the interactive API docs (/docs, /redoc, /openapi.json) on the
      # public backend so it does not advertise its endpoints. Local dev and
      # docker compose leave this unset and keep the docs available.
      - key: DEPLOY_ENV
        value: production

  - type: web
    name: broccoli-frontend
    runtime: docker
    plan: free
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      # Backend's public URL, hardcoded: Render's fromService can't return a
      # service's public *.onrender.com URL (only its private name, which is
      # unusable here - see the resolver note at the top of this file). The
      # host below carries a Render-generated suffix (-00na); if the backend
      # service is renamed or recreated that suffix changes, so update these
      # three values then - otherwise the frontend proxies to a dead host (502).
      - key: BACKEND_SCHEME
        value: https
      - key: BACKEND_HOST
        value: broccoli-backend-00na.onrender.com
      - key: BACKEND_PORT
        value: "443"
      # Same secret as the backend's API_KEY, kept in sync automatically.
      # nginx injects it as X-API-Key on proxied /api/ requests.
      - key: API_KEY
        fromService:
          type: web
          name: broccoli-backend
          envVarKey: API_KEY
